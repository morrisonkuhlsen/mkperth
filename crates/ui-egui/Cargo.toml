[package]
name = "mkperth-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MK Perth's egui frontend: the Activities window; swappable, nothing below depends on it"

[lints]
workspace = true

[dependencies]
mkperth-engine = { workspace = true }
egui = { workspace = true }
png = { workspace = true }
skrifa = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
# Since egui 0.37 its fonts are opt-in: the app gets them through eframe, tests and the snapshot
# example here.
egui = { workspace = true, features = ["default_fonts"] }
