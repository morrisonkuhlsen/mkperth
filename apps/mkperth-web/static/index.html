<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MK Perth</title>
  <meta name="description" content="MK Perth, an open-source project scheduler, running in your browser: nothing is sent anywhere.">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f2f2f5; }
    @media (prefers-color-scheme: dark) { html, body { background: #1f2025; } }
    canvas#mkperth { width: 100%; height: 100%; display: block; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 15px system-ui, sans-serif; color: #626470; }
  </style>
</head>
<body>
  <canvas id="mkperth"></canvas>
  <div id="loading">MK Perth…</div>
  <script type="module">
    import init from "./mkperth_web.js";
    await init();
    document.getElementById("loading").remove();
  </script>
</body>
</html>
