# Every AGENTS.md quality gate (cargo xtask ci: fmt, clippy -D warnings, tests, assets, layers,
# panics, wasm) on every pull request and every push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: cargo xtask ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust (stable + clippy, rustfmt, the wasm target)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Every gate
        run: cargo xtask ci
