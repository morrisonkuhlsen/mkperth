[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal
mkperth-i18n = { path = "crates/i18n" }
mkperth-core = { path = "crates/core" }
mkperth-sched = { path = "crates/sched" }
mkperth-perth = { path = "crates/perth" }
mkperth-p6xml = { path = "crates/p6xml" }
mkperth-engine = { path = "crates/engine" }
mkperth-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
# Perth.jl's project files are JSON; parsed with its recursion limit. MIT/Apache.
serde_json = { version = "1", features = ["preserve_order"] }
# P6 XML files, read event by event (the tree is built here, with caps). MIT.
quick-xml = "0.42"

# ui
# The splash screen's Morrison Kühlsen wordmark (PNG). MIT/Apache.
png = "0.18"
egui = "0.37"
eframe = { version = "0.37", default-features = false }
rfd = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
egui_kittest = "0.37"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Leftover debugging never lands (warnings are errors in the gate).
dbg_macro = "warn"
